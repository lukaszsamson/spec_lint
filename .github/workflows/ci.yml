name: CI
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - elixir: '1.18'
            otp: '27'
          - elixir: '1.19'
            otp: '28'
          - elixir: '1.20'
            otp: '28'
          - elixir: '1.20'
            otp: '29'
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix credo --strict
      - run: mix test
      - run: MIX_ENV=dev mix compile --force --warnings-as-errors
        if: matrix.elixir == '1.20' && matrix.otp == '29'
      - run: mix spec_lint
        if: matrix.elixir == '1.20' && matrix.otp == '29'
      - uses: actions/cache@v4
        if: matrix.elixir == '1.20' && matrix.otp == '29'
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-29-1.20-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-29-1.20-
      - run: mix dialyzer --format github
        if: matrix.elixir == '1.20' && matrix.otp == '29'
